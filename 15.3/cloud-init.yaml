#cloud-config
write_files:
  - path: /var/www/html/index.html
    permissions: '0644'
    content: |
      <html>
        <head>
          <meta charset="utf-8">
          <title>HW 15.2</title>
        </head>
        <body>
          <h1>Группа ВМ 15.2 работает</h1>
          <img src="https://storage.yandexcloud.net/geolook-20261007/picture.png" width="400">
        </body>
      </html>
  - path: /etc/apache2/conf-available/charset.conf
    content: |
      AddDefaultCharset UTF-8
runcmd:
  - a2enconf charset
  - systemctl enable --now apache2
  - systemctl reload apache2
